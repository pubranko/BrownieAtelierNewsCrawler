[project]
name = "BrownieAtelierNewsCrawler"
version = "0.0.1"
requires-python = "~=3.14"
dependencies = [
    "prefect>=3.4.0",
    "Scrapy>=2.0.0",
    "scrapy-selenium>=0.0.7",
    "scrapy-splash>=0.9.0",
    "selenium>=4.0.0",
    "pymongo>=4.0.0",
    "pysolr>=3.9.0",
    "beautifulsoup4>=4.0.0",
    "bs4",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pyperclip>=1.0.0",
    "fasteners>=0.0.0",
    "openpyxl>=3.0.0",
    "python-decouple>=3.0.0",
    "azure-common",
    "azure-core",
    "azure-storage-blob",
    "azure-storage-file-share",
    "azure-identity",
    "azure-keyvault-secrets",
    "azure-mgmt-containerinstance",
    "azure-mgmt-core",
    "azure-mgmt-resource",
    "azure-storage-queue",
    "psutil",
    "slack-sdk>=3.0.0",
    "prefect-docker",
]

[dependency-groups]
dev = [
    "ruff",
    "pyrefly",
    "sphinx",
    "jupyter",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

# ruff：コードチェック、フォーマッター。
[tool.ruff]
line-length = 120           # 1行の最大長
target-version = "py314"    # 対象 Python バージョン（3.14）

# ruffのコードチェック対象
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors（構文エラー、スタイル違反）
    "W",    # pycodestyle warnings（警告）
    "F",    # Pyflakes（未使用変数、未定義変数）
    "I",    # isort（import 文のソート）
    "B",    # flake8-bugbear（一般的なバグの原因）
    "C4",   # flake8-comprehensions（リスト内包表記の最適化）
    "UP",   # pyupgrade（古い Python 構文の警告）
]

# pyrefly：型チェックを3.14のバージョン基準で実施
[tool.pyrefly]
python-version = "3.14"
