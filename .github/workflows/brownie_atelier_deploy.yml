name: Brownie Atelier Deploy
run-name: Brownie Atelier Deploy!!!
on:
    # 以下のブランチにプッシュされた際起動
    push:
        branches: ['develop','master']
    # Githubより手動で起動
    workflow_dispatch:

# 環境判定とビルドを独立した共通ワークフローとして呼ぶ。
# 将来のテストジョブも Branch-Controll の env_name を参照できる。
jobs:
  Branch-Controll:
    uses: ./.github/workflows/common_branch_control.yml
  Image-Build:
    needs: [Branch-Controll]
    uses: ./.github/workflows/common_image_build.yml
    with:
      environment_name: ${{ needs.Branch-Controll.outputs.env_name }}
      base_branch: develop
    secrets: inherit

  # 公開処理はデプロイ専用。テスト用・共通ビルドからは呼び出さない。
  Brownie-Atelier-Deploy:
    needs: [Branch-Controll, Image-Build]
    runs-on: ubuntu-22.04
    environment:
      name: ${{ needs.Branch-Controll.outputs.env_name }}
    env:
      BASE_TAG: ${{ vars.BASE_TAG }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      TARGET_ENV: ${{ needs.Branch-Controll.outputs.env_name }}
      BUILD_TAG: ${{ needs.Image-Build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: 採番スクリプトの依存を導入
        run: python -m pip install requests
      - name: 共通ビルドのイメージを取得
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Image-Build.outputs.artifact_name }}
          path: ${{ runner.temp }}/crawler-image
      - name: イメージをロードして公開用タグを採番
        run: |
          docker load --input "$RUNNER_TEMP/crawler-image/crawler-image.tar"
          image_tag=$(python app/scripts/tag_create.py --mode "$TARGET_ENV")
          image_ref="$DOCKER_HUB_USERNAME/brownie-atelier-news-crawler:$image_tag"
          docker tag "brownie-atelier-news-crawler:$BUILD_TAG" "$image_ref"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
      - name: Docker Hubへログイン
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Docker Hubへ公開
        run: docker push "$IMAGE_REF"
