services:
    brownie-atelier-news-crawler-base:
        build:
            context: .
            dockerfile: dockerfile_base
            args:
                # dockerfile_base で参照する Ubuntu イメージと uv の版
                UBUNTU_TAG: ${UBUNTU_TAG:-26.04}
                UV_VERSION: ${UV_VERSION:-0.12.10}
                # コンテナ内の一般ユーザー
                CONTAINER_USER: ${CONTAINER_USER}
                # ブラウニー工房のgitリモートリポジトリー
                GIT_REMOTE_REPOSITORY: ${GIT_REMOTE_REPOSITORY}
                # 上記リポジトリーのgitブランチ
                GIT_BRANCH: ${GIT_BRANCH}
        image: brownie-atelier-news-crawler-base:${BASE_TAG}
